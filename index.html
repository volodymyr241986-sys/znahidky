<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Знахідки — каталог вінтажу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div id="pageBanner"></div>

    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="pages"></main>

  <footer>
    <span>Ведеться вручну, з любов'ю до старих речей</span>
    <span id="footer-count"></span>
  </footer>

</div>

<script>
// ===================== ІКОНКИ ПО КАТЕГОРІЯХ =====================
const icons = {
  books: `<svg viewBox="0 0 64 64" fill="none" stroke="#9C4A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 14c-6-5-14-6-20-4v34c6-2 14-1 20 4"/>
    <path d="M32 14c6-5 14-6 20-4v34c-6-2-14-1-20 4"/>
    <path d="M32 14v38"/>
  </svg>`,
  ceramics: `<svg viewBox="0 0 64 64" fill="none" stroke="#9C4A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 12h16v8c6 4 8 10 6 18-2 8-8 12-14 12s-12-4-14-12c-2-8 0-14 6-18z"/>
    <path d="M24 12h16"/>
    <path d="M40 26c4 1 8 4 8 8s-3 6-6 6"/>
  </svg>`,
  paintings: `<svg viewBox="0 0 64 64" fill="none" stroke="#9C4A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="12" width="44" height="34" rx="2"/>
    <path d="M10 38l12-10 9 8 8-12 15 16"/>
    <circle cx="22" cy="22" r="3.5"/>
    <path d="M20 52h24"/>
  </svg>`,
  vinyl: `<svg viewBox="0 0 64 64" fill="none" stroke="#9C4A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="20"/>
    <circle cx="32" cy="32" r="13" stroke-dasharray="1.5 4"/>
    <circle cx="32" cy="32" r="4" fill="#9C4A2E" stroke="none"/>
  </svg>`,
  other: `<svg viewBox="0 0 64 64" fill="none" stroke="#9C4A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 24l20-10 20 10-20 10z"/>
    <path d="M12 24v18l20 10 20-10V24"/>
    <path d="M32 34v18"/>
  </svg>`
};

const categories = [
  { id:'about',    label:'Про нас',              index:'00' },
  { id:'books',    label:'Книги',                index:'01' },
  { id:'ceramics', label:'Кераміка та фарфор',    index:'02' },
  { id:'paintings',label:'Картини',               index:'03' },
  { id:'vinyl',    label:'Вініл',                 index:'04' },
  { id:'other',    label:'Інше',                  index:'05' },
  { id:'articles', label:'Статті',                index:'06' },
];

// Публічна сторінка завантажує опубліковані дані з data.json (без кешу браузера).
let items = { books:[], ceramics:[], paintings:[], vinyl:[], other:[], articles:[] };

const tabsEl = document.getElementById('tabs');
const pagesEl = document.getElementById('pages');
let detailReturnTo = 'about';

categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.dataset.target = cat.id;
  btn.textContent = cat.label;
  btn.addEventListener('click', () => showPage(cat.id));
  tabsEl.appendChild(btn);
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function truncateText(str, maxLen){
  if (!str) return '';
  if (str.length <= maxLen) return str;
  return str.slice(0, maxLen).trim() + '…';
}

function getRecentFinds(limit){
  const realCatIds = categories.filter(c => c.id !== 'about' && c.id !== 'articles').map(c => c.id);
  let all = [];
  realCatIds.forEach(catId => {
    (items[catId] || []).forEach(it => {
      const m = /^it_(\d+)_/.exec(it.id);
      const ts = m ? parseInt(m[1], 10) : 0;
      all.push({ ...it, catId, ts });
    });
  });
  all.sort((a, b) => b.ts - a.ts);
  return all.slice(0, limit);
}

function getRecentArticles(limit){
  const all = (items.articles || []).map(a => {
    const m = /^art_(\d+)_/.exec(a.id);
    const ts = m ? parseInt(m[1], 10) : 0;
    return { ...a, ts };
  });
  all.sort((a, b) => b.ts - a.ts);
  return all.slice(0, limit);
}

function renderAboutPage(){
  const el = document.createElement('section');
  el.className = 'page';
  el.id = 'page-about';

  const recent = getRecentFinds(6);
  const recentHtml = recent.length ? recent.map(it => {
    return `
      <div class="recent-card" onclick="openDetail('${it.catId}','${it.id}')">
        <div class="thumb">${it.photo ? `<img src="${it.photo}" alt="">` : (icons[it.catId] || icons.other)}</div>
        <p>${escapeHtml(it.title)}</p>
      </div>
    `;
  }).join('') : `<div class="empty-note">Знахідок поки немає — скоро тут щось з'явиться.</div>`;

  const recentArticles = getRecentArticles(2);
  const articlesHtml = recentArticles.length ? recentArticles.map(a => `
    <div class="article-preview">
      <div class="article-preview-photo">${a.photo ? `<img src="${a.photo}" alt="">` : icons.other}</div>
      <h4>${escapeHtml(a.title)}</h4>
      <p>${escapeHtml(a.excerpt || '')}</p>
      <button class="read-btn" onclick="openArticleDetail('${a.id}')">Читати →</button>
    </div>
  `).join('') : `<div class="empty-note">Статей поки немає — скоро тут щось з'явиться.</div>`;

  el.innerHTML = `
    <div class="about-grid">
      <div>
        <h2>Про нас</h2>
        <p>Ми збираємо старі речі — не заради колекції на полиці, а заради історій, які до них додаються. Книга з чиїмось підписом на форзаці, тарілка з тріщинкою від часу, платівка з подряпиною, яку чути тільки на другій доріжці.</p>
        <p>Тут ми фіксуємо те, що знаходимо разом: де побували, що привезли додому, а що, можливо, вже знайшло нового господаря.</p>
        <p>Якщо щось із цього вас зацікавило — пишіть, розкажемо більше.</p>
      </div>
      <div class="signature-block">
        <span class="stamp">Що ми шукаємо</span>
        <ul>
          <li><strong>Книги</strong> — старі видання, з характером і історією</li>
          <li><strong>Кераміка та фарфор</strong> — посуд, дрібна пластика</li>
          <li><strong>Картини</strong> — невеликі формати, аматорський і професійний живопис</li>
          <li><strong>Вініл</strong> — переважно джаз, іноді щось поруч</li>
          <li><strong>Інше</strong> — все компактне і по-справжньому цікаве</li>
        </ul>
      </div>
    </div>

    <div class="recent-strip">
      <h3>Нові знахідки</h3>
      <div class="recent-list">${recentHtml}</div>
    </div>

    <div class="articles-strip">
      <h3>Статті</h3>
      <div class="articles-preview-grid">${articlesHtml}</div>
    </div>
  `;
  pagesEl.appendChild(el);
}

function buildCardHtml(cat, it, i){
  return `
    <article class="find-card" onclick="openDetail('${cat.id}','${it.id}')">
      <span class="cat-no">${cat.index}.${String(i+1).padStart(2,'0')}</span>
      <div class="thumb">${it.photo ? `<img src="${it.photo}" alt="">` : (icons[cat.id] || icons.other)}</div>
      <h3>${escapeHtml(it.title)}</h3>
      <p class="meta">знайдено: ${escapeHtml(it.place || '—')}</p>
      <p>${escapeHtml(truncateText(it.note, 90))}</p>
      <div class="card-footer">
        <span class="status ${it.status}">${it.status === 'sold' ? 'вже пішло' : 'є в наявності'}</span>
      </div>
    </article>
  `;
}

function getItemTs(it){
  const m = /^it_(\d+)_/.exec(it.id);
  return m ? parseInt(m[1], 10) : 0;
}

function renderCategoryGrid(cat){
  const grid = document.getElementById('grid-' + cat.id);
  const countEl = document.getElementById('count-' + cat.id);
  if (!grid) return;

  const searchVal = (document.getElementById('search-' + cat.id).value || '').trim().toLowerCase();
  const filterVal = document.getElementById('filter-' + cat.id).value;
  const sortVal = document.getElementById('sort-' + cat.id).value;

  let list = (items[cat.id] || []).slice();

  if (searchVal){
    list = list.filter(it => (it.title || '').toLowerCase().includes(searchVal));
  }
  if (filterVal !== 'all'){
    list = list.filter(it => it.status === filterVal);
  }
  if (sortVal === 'new'){
    list.sort((a, b) => getItemTs(b) - getItemTs(a));
  } else if (sortVal === 'old'){
    list.sort((a, b) => getItemTs(a) - getItemTs(b));
  } else if (sortVal === 'az'){
    list.sort((a, b) => a.title.localeCompare(b.title, 'uk'));
  }

  grid.innerHTML = list.length ? list.map((it, i) => buildCardHtml(cat, it, i)).join('') : `<div class="empty-note">Нічого не знайдено за цими умовами.</div>`;
  countEl.textContent = list.length + ' ' + (list.length === 1 ? 'позиція' : 'позицій');
}

function renderCategoryPage(cat){
  const el = document.createElement('section');
  el.className = 'page';
  el.id = 'page-' + cat.id;

  el.innerHTML = `
    <div class="page-toolbar">
      <input type="search" class="search-input" id="search-${cat.id}" placeholder="Пошук по назві…" oninput="renderCategoryGrid(categories.find(c => c.id==='${cat.id}'))">
      <select class="filter-select" id="filter-${cat.id}" onchange="renderCategoryGrid(categories.find(c => c.id==='${cat.id}'))">
        <option value="all">Усі</option>
        <option value="available">В наявності</option>
        <option value="sold">Продані</option>
      </select>
      <select class="filter-select" id="sort-${cat.id}" onchange="renderCategoryGrid(categories.find(c => c.id==='${cat.id}'))">
        <option value="new">Спочатку нові</option>
        <option value="old">Спочатку старі</option>
        <option value="az">За назвою (А-Я)</option>
      </select>
      <span class="count" id="count-${cat.id}"></span>
    </div>
    <div class="card-grid" id="grid-${cat.id}"></div>
  `;
  pagesEl.appendChild(el);
  renderCategoryGrid(cat);
}

function renderDetailPage(){
  let el = document.getElementById('page-detail');
  if (!el){
    el = document.createElement('section');
    el.className = 'page';
    el.id = 'page-detail';
    pagesEl.appendChild(el);
  }
  return el;
}

function openDetail(catId, itemId){
  const cat = categories.find(c => c.id === catId);
  const it = (items[catId] || []).find(x => x.id === itemId);
  if (!it) return;

  detailReturnTo = catId;
  const el = renderDetailPage();
  el.innerHTML = `
    <button class="back-btn" onclick="closeDetail()">← Назад до «${cat.label}»</button>
    <div class="detail-grid">
      <div class="detail-photo">${it.photo ? `<img src="${it.photo}" alt="">` : (icons[cat.id] || icons.other)}</div>
      <div class="detail-info">
        <span class="detail-cat-no">${cat.index} · ${cat.label}</span>
        <h2>${escapeHtml(it.title)}</h2>
        <div class="detail-meta-row">
          <span class="place">знайдено: ${escapeHtml(it.place || '—')}</span>
          <span class="status ${it.status}">${it.status === 'sold' ? 'вже пішло' : 'є в наявності'}</span>
        </div>
        <p class="note">${escapeHtml(it.note || 'Опис поки не додано.')}</p>
      </div>
    </div>
  `;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function closeDetail(){
  showPage(detailReturnTo);
}

function renderArticlesPage(){
  const el = document.createElement('section');
  el.className = 'page';
  el.id = 'page-articles';
  const list = getRecentArticles(999);

  const cardsHtml = list.length ? list.map(a => `
    <article class="find-card" onclick="openArticleDetail('${a.id}')">
      <div class="thumb">${a.photo ? `<img src="${a.photo}" alt="">` : icons.other}</div>
      <h3>${escapeHtml(a.title)}</h3>
      <p>${escapeHtml(truncateText(a.excerpt, 100))}</p>
    </article>
  `).join('') : `<div class="empty-note">Тут скоро з'являться наші історії про знахідки. Заглядайте пізніше.</div>`;

  el.innerHTML = `
    <div class="page-head">
      <h2>Статті</h2>
      <span class="count">${list.length} ${list.length === 1 ? 'стаття' : 'статей'}</span>
    </div>
    <div class="card-grid">${cardsHtml}</div>
  `;
  pagesEl.appendChild(el);
}

function renderArticleDetailPage(){
  let el = document.getElementById('page-article-detail');
  if (!el){
    el = document.createElement('section');
    el.className = 'page';
    el.id = 'page-article-detail';
    pagesEl.appendChild(el);
  }
  return el;
}

function openArticleDetail(articleId){
  const a = (items.articles || []).find(x => x.id === articleId);
  if (!a) return;

  detailReturnTo = 'articles';
  const el = renderArticleDetailPage();
  el.innerHTML = `
    <button class="back-btn" onclick="closeDetail()">← Назад до «Статті»</button>
    <div class="detail-grid">
      <div class="detail-photo">${a.photo ? `<img src="${a.photo}" alt="">` : icons.other}</div>
      <div class="detail-info">
        <h2>${escapeHtml(a.title)}</h2>
        <p class="note">${escapeHtml(a.content || a.excerpt || '')}</p>
      </div>
    </div>
  `;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

let totalItemsCount = 0;

const SOCIAL_ICONS_HTML = `
  <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
  </a>
  <a href="https://t.me" target="_blank" rel="noopener" aria-label="Telegram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 4L2.5 11.5l6 2 2 6.5 3-4 4.5 3.5L21 4z"/><path d="M8.5 13.5L19 6"/></svg>
  </a>
  <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h-2a4 4 0 0 0-4 4v3H6v4h3v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3z"/></svg>
  </a>
`;

function renderPageBanner(id){
  const banner = document.getElementById('pageBanner');
  if (id === 'about'){
    banner.innerHTML = `
      <div class="hero-bleed">
        <img src="https://images.stockcake.com/public/8/e/a/8eaa13a5-dd94-4970-b8cf-043bc730c447_large/cozy-record-shelf-stockcake.jpg" alt="Затишна поличка з книгами та платівками">
        <div class="hero-bleed-overlay"></div>
        <div class="hero-bleed-top">
          <div class="brand"><div class="brand-mark">З<span class="brand-dot"></span></div></div>
          <div class="social-links social-links-light">${SOCIAL_ICONS_HTML}</div>
        </div>
        <div class="hero-bleed-text">
          <p class="eyebrow">Домашній каталог · вед. з 2026</p>
          <h1>Знахідки <em>на двох</em></h1>
        </div>
        <div class="counter-pill hero-bleed-counter"><span>${totalItemsCount}</span> знахідок з 2026 року</div>
      </div>
    `;
  } else {
    banner.innerHTML = `
      <div class="site-top-with-title">
        <div class="brand"><div class="brand-mark">З<span class="brand-dot"></span></div></div>
        <h1 class="page-banner-title">Знахідки <em>на двох</em></h1>
        <div class="social-links">${SOCIAL_ICONS_HTML}</div>
      </div>
    `;
  }
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelector(`nav.tabs button[data-target="${id}"]`).classList.add('active');
  renderPageBanner(id);
}

async function init(){
  pagesEl.innerHTML = '<p class="loading-note">Завантажуємо каталог…</p>';
  try{
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok){
      items = await res.json();
    }
  }catch(e){
    // немає зв'язку або файл ще не опубліковано — лишаємось з порожнім каталогом
  }

  pagesEl.innerHTML = '';
  categories.forEach(cat => {
    if (cat.id === 'about') renderAboutPage();
    else if (cat.id === 'articles') renderArticlesPage();
    else renderCategoryPage(cat);
  });

  totalItemsCount = Object.values(items).reduce((sum, arr) => sum + arr.length, 0);
  document.getElementById('footer-count').textContent = totalItemsCount + ' знахідок у каталозі';

  showPage('about');
}
init();
</script>
</body>
</html>
