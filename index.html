<script>
// ===================== ІКОНКИ ПО КАТЕГОРІЯХ =====================
// ===================== ЛАЙТБОКС =====================
function openLightbox(src){
  if (!src) return;
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e){
  if (e && e.target.id !== 'lightboxOverlay' && !e.target.classList.contains('lightbox-close')) return;
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox({ target: { id: 'lightboxOverlay' } });
});

// ===================== ПЛАВНА ПОЯВА ПРИ СКРОЛІ =====================
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting){
      entry.target.classList.add('in-view');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

function observeReveals(root){
  (root || document).querySelectorAll('.reveal:not(.in-view)').forEach(el => revealObserver.observe(el));
}

let items = { books:[], ceramics:[], paintings:[], vinyl:[], other:[], articles:[], featured:null, featuredStory:null, contacts:null };
const DEFAULT_CONTACTS = {

};

const tabsEl = document.getElementById('tabs');
const pagesEl = document.getElementById('pages');
let detailReturnTo = 'about';

const FINDS_GROUP_IDS = ['books','ceramics','paintings','vinyl','other'];
const TOP_TAB_SEQUENCE = ['about', 'finds-group', 'articles', 'shop', 'contacts'];

function buildTopTabs(){
  TOP_TAB_SEQUENCE.forEach(id => {
    if (id === 'finds-group'){
      const wrap = document.createElement('div');
      wrap.className = 'finds-tab-wrap';

      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'tab-finds';
      trigger.id = 'findsTabTrigger';
      trigger.innerHTML = `Знахідки <svg class="finds-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
      trigger.addEventListener('click', (e) => { e.stopPropagation(); toggleFindsDropdown(); });
      wrap.appendChild(trigger);

      const dropdown = document.createElement('div');
      dropdown.className = 'finds-dropdown';
      dropdown.id = 'findsDropdown';
      FINDS_GROUP_IDS.forEach(catId => {
        const cat = categories.find(c => c.id === catId);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'finds-dropdown-card';
        card.dataset.target = catId;
        card.innerHTML = `<span class="finds-dropdown-icon">${icons[catId] || icons.other}</span><span class="finds-dropdown-label">${cat.label}</span>`;
        card.addEventListener('click', () => { showPage(catId); closeFindsDropdown(); });
        dropdown.appendChild(card);
      });
      wrap.appendChild(dropdown);
      tabsEl.appendChild(wrap);
    } else {
      const cat = categories.find(c => c.id === id);
      const btn = document.createElement('button');
      btn.dataset.target = cat.id;
      btn.textContent = cat.label;
      if (cat.id === 'shop') btn.classList.add('tab-shop');
      btn.addEventListener('click', () => showPage(cat.id));
      tabsEl.appendChild(btn);
    }
  });
}
buildTopTabs();

function toggleFindsDropdown(){
  document.querySelector('.finds-tab-wrap').classList.toggle('open');
}
function closeFindsDropdown(){
  const wrap = document.querySelector('.finds-tab-wrap');
  if (wrap) wrap.classList.remove('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.finds-tab-wrap')){
    closeFindsDropdown();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFindsDropdown();

window.addEventListener('scroll', () => {

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function truncateText(str, maxLen){
  if (!str) return '';
  if (str.length <= maxLen) return str;
  return str.slice(0, maxLen).trim() + '…';
}

function scrollRecentList(dir){
  const list = document.getElementById('recentList');
  if (!list) return;
  list.scrollBy({ left: dir * 330, behavior: 'smooth' });
}

function getRecentFinds(limit){
  const realCatIds = categories.filter(c => c.id !== 'about' && c.id !== 'articles').map(c => c.id);
  let all = [];
  realCatIds.forEach(catId => {
    (items[catId] || []).forEach(it => {
      const m = /^it_(\d+)_/.exec(it.id);
      const ts = m ? parseInt(m[1], 10) : 0;
      all.push({ ...it, catId, ts });
    });
  });
  all.sort((a, b) => b.ts - a.ts);
  return all.slice(0, limit);
}

function getRecentArticles(limit){
  const all = (items.articles || []).map(a => {
    const m = /^art_(\d+)_/.exec(a.id);
    const ts = m ? parseInt(m[1], 10) : 0;
    return { ...a, ts };
  });
  all.sort((a, b) => b.ts - a.ts);
  return all.slice(0, limit);
}

const UK_MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

function formatMonthYear(ts){
  if (!ts) return '';
  const d = new Date(ts);
  return UK_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function buildFeaturedFindHtml(){
  if (!items.featured || !items.featured.catId || !items.featured.itemId) return '';
  const cat = categories.find(c => c.id === items.featured.catId);
  const it = (items[items.featured.catId] || []).find(x => x.id === items.featured.itemId);
  if (!cat || !it) return '';

  const ts = getItemTs(it);
  const dateStr = formatMonthYear(ts);
  const subtitle = (it.specs && it.specs.length)
    ? it.specs.slice(0, 2).map(s => s.value).filter(Boolean).join('. ')
    : cat.label;

  return `
    <div class="featured-find">
      <h3 class="section-title">Знахідка місяця</h3>
      <div class="featured-find-body">
        <div class="featured-find-photo"${it.photo ? ` onclick="openLightbox('${it.photo}')" style="cursor:zoom-in;"` : ''}>${it.photo ? `<img src="${it.photo}" alt="">` : (icons[cat.id] || icons.other)}</div>
        <div class="featured-find-content">
          <h4>${escapeHtml(it.title)}</h4>
          ${subtitle ? `<p class="featured-find-subtitle">${escapeHtml(subtitle)}</p>` : ''}
          <p class="featured-find-desc">${escapeHtml(truncateText(it.note, 130))}</p>
          <button class="read-btn" onclick="openDetail('${cat.id}','${it.id}')">Дізнатися історію →</button>
          <div class="featured-find-meta">
            ${it.place ? `<span>📍 ${escapeHtml(it.place)}</span>` : ''}
            ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

const STATS_CATEGORIES = ['books','ceramics','paintings','vinyl','other'];

function buildStatsHtml(){
  const total = STATS_CATEGORIES.reduce((sum, id) => sum + (items[id] || []).length, 0);
  const cellsHtml = STATS_CATEGORIES.map(catId => {
    const cat = categories.find(c => c.id === catId);
    const count = (items[catId] || []).length;
    return `
      <div class="stat-cell" onclick="showPage('${catId}')">
        <div class="stat-icon">${icons[catId] || icons.other}</div>
        <span class="stat-num">${count}</span>
        <span class="stat-label">${cat.label.toLowerCase()}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="stats-block">
      <h3>Наша колекція в цифрах</h3>
      <div class="stats-grid">
        ${cellsHtml}
        <div class="stat-cell stat-cell-total">
          <span class="stat-num">${total}</span>
          <span class="stat-label">знахідок загалом</span>
        </div>
      </div>
    </div>
  `;
}

// ===================== КРАМНИЦЯ =====================
function getShopItems(){
  let all = [];
  STATS_CATEGORIES.forEach(catId => {
    (items[catId] || []).forEach(it => {
      if (it.forSale) all.push({ ...it, catId });
    });
  });
  return all;
}

function buildShopCardHtml(it, i){
  const cat = categories.find(c => c.id === it.catId);
  return `
    <article class="find-card reveal" style="--i:${i % 8}" onclick="openDetail('${it.catId}','${it.id}')">
      <span class="cat-no">${cat.index}.${String(i+1).padStart(2,'0')}</span>
      <div class="thumb">
        ${isRecent(it) && it.status !== 'sold' ? `<span class="new-badge">нове</span>` : ''}
        ${it.photo ? `<img src="${it.photo}" alt="">` : (icons[it.catId] || icons.other)}
      </div>
      <h3>${escapeHtml(it.title)}</h3>
      <span class="meta">${cat.label.toLowerCase()}</span>
      <p>${escapeHtml(truncateText(it.note, 80))}</p>
      <div class="card-footer shop-card-footer">
        ${it.status === 'sold'
          ? `<span class="shop-price shop-price-sold">${it.price ? escapeHtml(it.price) : ''}</span><span class="status sold">продано</span>`
          : `<span class="shop-price">${it.price ? escapeHtml(it.price) : 'ціна за запитом'}</span><span class="shop-cta">написати →</span>`
        }
      </div>
    </article>
  `;
}

function renderShopGrid(){
  const grid = document.getElementById('shop-grid');
  const countEl = document.getElementById('shop-count');
  if (!grid) return;

  const searchVal = (document.getElementById('shop-search').value || '').trim().toLowerCase();
  const catVal = document.getElementById('shop-filter-cat').dataset.value;
  const availVal = document.getElementById('shop-filter-avail').dataset.value;
  const sortVal = document.getElementById('shop-sort').dataset.value;

  let list = getShopItems();

  if (searchVal){
    list = list.filter(it => (it.title || '').toLowerCase().includes(searchVal));
  }
  if (catVal !== 'all'){
    list = list.filter(it => it.catId === catVal);
  }
  if (availVal !== 'all'){
    list = list.filter(it => it.status === availVal);
  }

  const parsePrice = (p) => {
    const n = parseFloat((p || '').replace(/[^\d.]/g, ''));
    return isNaN(n) ? 0 : n;
  };

  if (sortVal === 'new'){
    list.sort((a, b) => getItemTs(b) - getItemTs(a));
  } else if (sortVal === 'old'){
    list.sort((a, b) => getItemTs(a) - getItemTs(b));
  } else if (sortVal === 'az'){
    list.sort((a, b) => a.title.localeCompare(b.title, 'uk'));
  } else if (sortVal === 'price-asc'){
    list.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
  } else if (sortVal === 'price-desc'){
    list.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
  }

  grid.innerHTML = list.length ? list.map((it, i) => buildShopCardHtml(it, i)).join('') : `<div class="empty-note">Поки що немає товарів за цими умовами.</div>`;
  countEl.textContent = list.length + ' ' + (list.length === 1 ? 'товар' : 'товарів');
  observeReveals(grid);
}

function buildPastInDetailHtml(){
  const storyId = items.featuredStory;
  if (!storyId) return '';
  const a = (items.articles || []).find(x => x.id === storyId);
  if (!a) return '';

  const stepsHtml = TIMELINE_STEPS.map((step, i) => {
    const text = (a.timeline && a.timeline[i]) ? a.timeline[i] : '';
    if (!text) return '';
    return `
      <div class="timeline-step">
        <div class="timeline-icon">${step.icon}</div>
        <p class="timeline-step-label">${String(i+1).padStart(2,'0')}. ${step.label}</p>
        <p class="timeline-step-text">${escapeHtml(text)}</p>
      </div>
    `;
  }).join('');

  if (!stepsHtml) return '';

  return `
    <div class="past-detail">
      <div class="past-detail-left">
        <h3 class="section-title past-detail-heading">Минуле в деталях</h3>
        <h4 class="past-detail-title">${escapeHtml(a.title)}</h4>
        ${a.subtitle ? `<p class="past-detail-subtitle">${escapeHtml(a.subtitle)}</p>` : ''}
        <div class="timeline-row">${stepsHtml}</div>

    </div>
  `;
}

function buildCardHtml(cat, it, i){
  return `
    <article class="find-card reveal" style="--i:${i % 8}" onclick="openDetail('${cat.id}','${it.id}')">
      <span class="cat-no">${cat.index}.${String(i+1).padStart(2,'0')}</span>
      <div class="thumb">
        ${isRecent(it) ? `<span class="new-badge">нове</span>` : ''}
        ${it.forSale ? `<span class="for-sale-badge">на продаж</span>` : ''}
        ${it.photo ? `<img src="${it.photo}" alt="">` : (icons[cat.id] || icons.other)}
      </div>
      <h3>${escapeHtml(it.title)}</h3>
      <p class="meta">знайдено: ${escapeHtml(it.place || '—')}</p>
      <p>${escapeHtml(truncateText(it.note, 90))}</p>
      <div class="card-footer">
        <span class="status ${it.status}">${it.status === 'sold' ? 'вже пішло' : 'є в наявності'}</span>
      </div>
    </article>
  `;
}

function getItemTs(it){
  const m = /^it_(\d+)_/.exec(it.id);
  return m ? parseInt(m[1], 10) : 0;
}

function isRecent(it){
  const ts = getItemTs(it);
  return ts > 0 && (Date.now() - ts) < 7 * 24 * 60 * 60 * 1000;
}

function renderCategoryGrid(cat){
  const grid = document.getElementById('grid-' + cat.id);
  const countEl = document.getElementById('count-' + cat.id);
  if (!grid) return;

  const searchVal = (document.getElementById('search-' + cat.id).value || '').trim().toLowerCase();
  const filterVal = document.getElementById('filter-' + cat.id).dataset.value;
  const sortVal = document.getElementById('sort-' + cat.id).dataset.value;

  let list = (items[cat.id] || []).slice();

  if (searchVal){
    list = list.filter(it => (it.title || '').toLowerCase().includes(searchVal));
  }
  if (filterVal !== 'all'){
    list = list.filter(it => it.status === filterVal);
  }
  if (sortVal === 'new'){
    list.sort((a, b) => getItemTs(b) - getItemTs(a));
  } else if (sortVal === 'old'){
    list.sort((a, b) => getItemTs(a) - getItemTs(b));
  } else if (sortVal === 'az'){
    list.sort((a, b) => a.title.localeCompare(b.title, 'uk'));
  }

  grid.innerHTML = list.length ? list.map((it, i) => buildCardHtml(cat, it, i)).join('') : `<div class="empty-note">Нічого не знайдено за цими умовами.</div>`;
  countEl.textContent = list.length + ' ' + (list.length === 1 ? 'позиція' : 'позицій');
  observeReveals(grid);
}

const FILTER_LABELS = { all:'Усі', available:'В наявності', sold:'Продані' };
const SORT_LABELS = { new:'Спочатку нові', old:'Спочатку старі', az:'За назвою (А-Я)' };
const DROPDOWN_LABELS = {};

function buildCustomSelect(id, labels, current){
  DROPDOWN_LABELS[id] = labels;
  const optionsHtml = Object.entries(labels).map(([val, label]) => `
    <div class="custom-select-option${val === current ? ' selected' : ''}" data-value="${val}" onclick="selectDropdownOption('${id}', '${val}')">${label}</div>
  `).join('');
  return `
    <div class="custom-select" id="${id}" data-value="${current}">
      <button type="button" class="custom-select-trigger" onclick="toggleDropdown('${id}')">
        <span class="custom-select-label">${labels[current]}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="custom-select-options">${optionsHtml}</div>
    </div>
  `;
}

function toggleDropdown(id){
  const el = document.getElementById(id);
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.custom-select.open').forEach(d => d.classList.remove('open'));
  if (!isOpen) el.classList.add('open');
}

function selectDropdownOption(id, value){
  const el = document.getElementById(id);
  el.dataset.value = value;
  const labels = DROPDOWN_LABELS[id] || FILTER_LABELS;
  el.querySelector('.custom-select-label').textContent = labels[value];
  el.querySelectorAll('.custom-select-option').forEach(o => o.classList.toggle('selected', o.dataset.value === value));
  el.classList.remove('open');

  if (id.startsWith('shop-')){
    renderShopGrid();
    return;
  }
  const catId = id.replace(/^(filter|sort)-/, '');
  const cat = categories.find(c => c.id === catId);
  if (cat) renderCategoryGrid(cat);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.custom-select')){
    document.querySelectorAll('.custom-select.open').forEach(d => d.classList.remove('open'));
  }
});

function showToast(text){
  let toast = document.getElementById('shareToast');
  if (!toast){
    toast = document.createElement('div');
    toast.id = 'shareToast';
    toast.className = 'share-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  toast.classList.add('visible');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
}

function shareLink(hash){
  const url = window.location.origin + window.location.pathname + '#' + hash;
  const finish = () => showToast('Посилання скопійовано!');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(finish).catch(() => {
      window.prompt('Скопіюйте посилання:', url);
    });
  } else {
    window.prompt('Скопіюйте посилання:', url);
  }
}

        </div></div>
        <h1 class="page-banner-title">Знахідки <em>на двох</em></h1>
        <div class="social-links">${SOCIAL_ICONS_HTML}</div>
      </div>
    `;
  }
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelector(`nav.tabs button[data-target="${id}"]`).classList.add('active');
  const findsTrigger = document.getElementById('findsTabTrigger');
  if (findsTrigger) findsTrigger.classList.toggle('active', FINDS_GROUP_IDS.includes(id));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.target === id));
  renderPageBanner(id);
}

async function init(){
  pagesEl.innerHTML = '<p class="loading-note">Завантажуємо каталог…</p>';
  try{
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok){
      items = await res.json();
    }
  }catch(e){
    // немає зв'язку або файл ще не опубліковано — лишаємось з порожнім каталогом
  }

  pagesEl.innerHTML = '';
  categories.forEach(cat => {
    if (cat.id === 'about') renderAboutPage();
    else if (cat.id === 'articles') renderArticlesPage();
    else if (cat.id === 'shop') renderShopPage();
    else if (cat.id === 'contacts') renderContactsPage();
    else renderCategoryPage(cat);
  });

  totalItemsCount = STATS_CATEGORIES.reduce((sum, id) => sum + (items[id] || []).length, 0);
  document.getElementById('footer-count').textContent = totalItemsCount + ' знахідок у каталозі';

  openFromHash();
}
init();

function openFromHash(){
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash){
    showPage('about');
    return;
  }
  if (hash.includes('/')){
    const [catId, itemId] = hash.split('/');
    if (catId === 'articles' && (items.articles || []).some(a => a.id === itemId)){
      openArticleDetail(itemId);
      return;
    }
    if (categories.find(c => c.id === catId) && (items[catId] || []).some(x => x.id === itemId)){
      openDetail(catId, itemId);
      return;
    }
    showPage('about');
    return;
  }
  if (categories.find(c => c.id === hash)){
    showPage(hash);
  } else {
    showPage('about');
  }
}
</script>
